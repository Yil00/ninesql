name: Release

# Release artifacts (P6-A, ADR-0010 §4 and §5, RELEASE.md §3): the .deb built twice on two
# runners from two checkout paths and compared byte for byte, the install test on Debian 12 / 13
# and Ubuntu 22.04 / 24.04, a CycloneDX SBOM, SHA256SUMS and cosign keyless signatures (Sigstore,
# GitHub OIDC). Runs on the push of a version tag only: never on pull requests or branches, and
# nothing is published from any other event.
#
# Signing and release creation are two jobs, each with only the permission it needs (`sign`:
# `id-token: write`; `release`: `contents: write`), both in the `release` environment, which the
# maintainer configures with a required reviewer and a `v*` tag deployment policy, next to a tag
# ruleset that lets only the maintainer push `refs/tags/v*` (packaging/README.md, P6-B).
#
# The release is created as a DRAFT: the maintainer checks it and publishes it (P6-B). The APT
# repository on GitHub Pages and the Flatpak bundle are P6-B hooks, not done here
# (packaging/README.md).
#
# A tag pushed by a workflow with GITHUB_TOKEN does not start this workflow (GitHub does not
# trigger workflows from GITHUB_TOKEN events): push the tag yourself, or with a GitHub App token.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  # Toolchain of release builds, pinned (ADR-0010 §5); rust-toolchain.toml follows `stable` for
  # development. Must be 1.89 or newer (ADR-0012). Bump it in its own PR.
  RUSTUP_TOOLCHAIN: "1.100.0"
  CARGO_DEB_VERSION: "3.8.0"
  CARGO_ABOUT_VERSION: "0.9.3"
  CARGO_CYCLONEDX_VERSION: "0.5.10"
  # The same cargo-deny as the CI `deny` job (ci.yml); bump both together.
  CARGO_DENY_VERSION: "0.20.2"
  COSIGN_VERSION: "v3.1.4"

jobs:
  build:
    name: Build .deb (${{ matrix.replica }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Two checkout paths: the build must not depend on where the sources are.
          - replica: a
            path: ninesql
          - replica: b
            path: build/elsewhere/src
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.path }}
          persist-credentials: false
          fetch-depth: 0
      - name: Tag matches the workspace version, commit is on main
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME is not on main (RELEASE.md)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      # Supply-chain gate at tag time (P6-E review L2): the tagged commit's dependencies are
      # checked again before anything is built, with today's advisory database, so a release
      # cannot ship a crate that became vulnerable, banned or unlicensed since its PR's CI ran,
      # nor a patched crate that drifted from its audited archive.
      - name: Supply-chain gate (cargo-deny, locked)
        run: |
          cargo install --locked --version "$CARGO_DENY_VERSION" cargo-deny
          cargo deny --locked check advisories bans licenses sources
      - name: Patched crates
        run: bash scripts/verify-patches.sh
      - name: Packaging tools (built from crates.io, locked)
        run: |
          cargo install --locked "cargo-deb@$CARGO_DEB_VERSION" "cargo-cyclonedx@$CARGO_CYCLONEDX_VERSION"
          cargo install --locked "cargo-about@$CARGO_ABOUT_VERSION" --features cli
      - name: Build the .deb (Ubuntu 22.04 builder, no network during the build)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          export NINESQL_DEB_OUT="$RUNNER_TEMP/out"
          packaging/deb/build.sh
      # ADR-0029 §2.2, guard 2: an e2e-scenarios test build is never signed nor shipped. build.sh
      # already refused the marker; checked again here through the same script, on the built
      # binary and on the binary inside the .deb that the sign job signs. The script exits 1 on
      # the marker and 2 on a missing or unreadable file, so a read error fails the step too.
      - name: No e2e-scenarios test build (marker check)
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/deb-contents"
          rm -rf "$extracted"
          shopt -s nullglob
          debs=("$RUNNER_TEMP"/out/*.deb)
          shopt -u nullglob
          if [ "${#debs[@]}" -ne 1 ] || [ ! -f "${debs[0]}" ]; then
            echo "::error::expected exactly one .deb in $RUNNER_TEMP/out"
            exit 1
          fi
          dpkg-deb -x "${debs[0]}" "$extracted"
          if ! bash packaging/check-no-e2e-marker.sh \
            "$RUNNER_TEMP/target/deb-build/release/ninesql" "$extracted/usr/bin/ninesql"; then
            echo "::error::e2e-scenarios marker check failed (marker found or binary unreadable, ADR-0029 §2.2)"
            exit 1
          fi
          rm -rf "$extracted"
      - name: SBOM (CycloneDX)
        if: matrix.replica == 'a'
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            python3 packaging/sbom.py "$RUNNER_TEMP/out/ninesql_${GITHUB_REF_NAME#v}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.replica }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  reproducible:
    name: Reproducibility check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          path: artifacts
      - name: Both builds are byte-identical
        run: |
          a=$(ls artifacts/deb-a/*.deb)
          b=$(ls artifacts/deb-b/*.deb)
          sha256sum "$a" "$b"
          if ! cmp -s "$a" "$b"; then
            echo "::error::the two .deb builds differ (ADR-0010 §5)"
            exit 1
          fi

  install-test:
    name: Install test (Debian 12 / 13, Ubuntu 22.04 / 24.04)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-a
          path: artifacts
      - run: packaging/deb/install-test.sh artifacts/*.deb

  sign:
    name: Sign the release files
    needs: [build, reproducible, install-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The `release` environment (repository settings, P6-B): a required reviewer (the
    # maintainer) and a deployment policy limited to `v*` tags, so no signature exists before
    # the maintainer approves this run (packaging/README.md, "Who can sign a release").
    environment: release
    permissions:
      # Only the OIDC token cosign exchanges for a short-lived Sigstore certificate (keyless):
      # no write access to the repository in the job that can sign.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-a
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: SHA256SUMS and signatures
        working-directory: dist
        run: |
          sha256sum -- *.deb *.cdx.json > SHA256SUMS
          cat SHA256SUMS
          for file in *.deb *.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create the draft release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      # The draft release and its assets; no OIDC token, so this job cannot sign.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Release notes (with the commit the signatures are bound to)
        run: |
          sed -e "s|@VERSION@|${GITHUB_REF_NAME#v}|g" \
              -e "s|@TAG@|$GITHUB_REF_NAME|g" \
              -e "s|@COMMIT@|$GITHUB_SHA|g" \
              -e "s|@REPOSITORY@|$GITHUB_REPOSITORY|g" \
              packaging/release-notes.md > "$RUNNER_TEMP/notes.md"
          if grep -q '@[A-Z]*@' "$RUNNER_TEMP/notes.md"; then
            echo "::error::unreplaced placeholder in packaging/release-notes.md"
            exit 1
          fi
      - name: Draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${prerelease[@]}" \
            --title "NineSQL ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            -- *.deb *.cdx.json SHA256SUMS *.sigstore.json
