name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # System packages for GPUI (P0-A, docs/10-supported-platforms.md): the ninesql-ui spike
      # example is built by clippy --all-targets and cargo test.
      - name: System packages for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake libvulkan-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libzstd-dev libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny (licenses, bans, sources, advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
      # ADR-0013 (security review of P0-A): GPUI must never get an HTTP client (I2), and
      # GPUI's credential API must not be used: secrets go through ninesql-secrets (I1).
      - name: Forbidden GPUI APIs under crates/
        run: |
          pattern='set_http_client|with_http_client|read_credentials|write_credentials|delete_credentials'
          if git grep -nE "$pattern" -- crates/; then
            echo "::error::Forbidden GPUI API used under crates/ (ADR-0013): $pattern"
            exit 1
          fi

  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-md-links.py

  ci-result:
    name: CI result
    if: always()
    needs: [rust, deny, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "::error::A required job ended with: $r"; exit 1; fi
          done
