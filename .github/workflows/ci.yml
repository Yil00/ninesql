name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # System packages for GPUI (P0-A, docs/10-supported-platforms.md): GPUI is a normal
      # dependency of ninesql-ui since P1-A (the `ninesql` binary); its TestAppContext tests run
      # headless under cargo test.
      - name: System packages for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake libvulkan-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libzstd-dev libasound2-dev
      # dbus-daemon for the ninesql-secrets tests of DesktopLockWatcher on a private bus
      # (fake logind, bus restarts); NINESQL_REQUIRE_DBUS=1 below makes them fail, not skip,
      # without it.
      - name: dbus-daemon for the lock watcher tests
        run: sudo apt-get install -y --no-install-recommends dbus-daemon
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          NINESQL_REQUIRE_DBUS: "1"

  # Driver integration tests against the dev containers (ADR-0009, AGENTS.md): the `core` profile
  # of dev/compose.yaml (PostgreSQL, MySQL, MariaDB; SQLite needs no container), and the OpenSSH
  # containers that the ninesql-core and ninesql-ssh tests start themselves with `docker run`.
  # NINESQL_REQUIRE_ENGINES turns a skipped test into a failure when an engine is unreachable.
  driver-integration:
    name: Driver integration tests (dev containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Own compose project, so this job never stops or reuses the containers of another run
      # on the same Docker daemon (the dev-env workflow and local runs use `ninesql-dev`).
      # The published ports are still the fixed ones of dev/compose.yaml.
      COMPOSE_PROJECT_NAME: ninesql-ci-drivers
      # P4-C: the wire-compatible engines of the sql profile (TimescaleDB, YugabyteDB and
      # QuestDB for pgwire, TiDB for mysqlwire). Measured locally: seeded within about 45 s
      # (YugabyteDB, the slowest), about 2.3 GB of memory together.
      NINESQL_REQUIRE_ENGINES: postgresql,mysql,mariadb,ssh,timescaledb,yugabytedb,questdb,tidb
      WIRE_ENGINES: timescaledb,yugabytedb,questdb,tidb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # System packages for GPUI: ninesql-ui's TestAppContext tests against the dev engines
      # (src/engine_tests, ADR-0029 step 1) run here too, headless like in the rust job.
      - name: System packages for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake libvulkan-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libzstd-dev libasound2-dev
      - name: Pull images
        run: |
          timeout 900 docker compose -f dev/compose.yaml --profile core pull --quiet
          timeout 900 docker compose -f dev/compose.yaml --profile sql pull --quiet \
            timescaledb yugabytedb questdb tidb
      - name: Start and wait for readiness
        run: |
          python3 dev/ready.py up core --timeout 900
          python3 dev/ready.py up sql --engines "$WIRE_ENGINES" --timeout 900
      - name: Integration tests
        run: >-
          cargo test --locked
          -p ninesql-driver-pgwire -p ninesql-driver-mysqlwire -p ninesql-driver-sqlite
          -p ninesql-core -p ninesql-ssh -p ninesql-ui
      - name: Show state
        if: always()
        run: docker compose -f dev/compose.yaml --profile all ps --all
      - name: Stop
        if: always()
        run: python3 dev/ready.py down

  # macOS build of the application (docs/10-supported-platforms.md: development only, kept
  # compiling for UI iteration; GPUI renders with Metal there). It cannot be checked from Linux:
  # cross-compiling fails without the Apple SDK (ring needs it). Part of the needs of
  # "CI result" below since it went green on GitHub Actions (PR #9). deny.toml checks Linux
  # targets only, so macOS-only dependencies are not license-checked by the deny job.
  macos:
    name: macOS build (ninesql-ui)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p ninesql-ui --bin ninesql --locked
      - run: cargo test -p ninesql-ui --locked
      # Last, so a build or test failure is reported first; it re-checks the dependencies in
      # check mode, which costs extra time.
      - run: cargo clippy -p ninesql-ui --all-targets --locked -- -D warnings

  deny:
    name: cargo-deny (licenses, bans, sources, advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
      # Patched third-party crates (docs/audits/gpui-snapshot.md): allowlisted [patch] entries
      # under crates/patches/ only, no registry source in Cargo.lock, archive sha256 as recorded,
      # and every changed file marked "Modified for NineSQL".
      - name: Patched crates
        run: scripts/verify-patches.sh
      # ADR-0029 §2.2: the e2e-scenarios test feature is in no default feature and enabled by no
      # workspace crate (cargo metadata), with the tests of that guard and of the marker check.
      - name: e2e-scenarios feature guard
        run: make e2e-feature-guard
      # ADR-0013 (security review of P0-A): GPUI must never get an HTTP client (I2), and
      # GPUI's credential API must not be used: secrets go through ninesql-secrets (I1).
      - name: Forbidden GPUI APIs under crates/
        run: |
          pattern='set_http_client|with_http_client|read_credentials|write_credentials|delete_credentials'
          if git grep -nE "$pattern" -- crates/; then
            echo "::error::Forbidden GPUI API used under crates/ (ADR-0013): $pattern"
            exit 1
          fi

  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-md-links.py

  ci-result:
    name: CI result
    if: always()
    needs: [rust, driver-integration, macos, deny, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "::error::A required job ended with: $r"; exit 1; fi
          done
