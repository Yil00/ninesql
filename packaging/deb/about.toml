# cargo-about configuration of the third-party license file shipped in the .deb
# (/usr/share/doc/ninesql/THIRD-PARTY-LICENSES.txt, P6-A, ADR-0010 §1, ADR-0002 rule 5).
# Run by packaging/deb/build.sh with --frozen (no network): license texts come from the crates themselves,
# nothing is fetched (no ClearlyDefined, no git).

# The licenses deny.toml allows (ADR-0002, I7). A crate under any other license makes
# `cargo about generate --fail` fail, as `cargo deny check licenses` does.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
]
# The binary is built for this target only.
targets = ["x86_64-unknown-linux-gnu"]
# Only what is linked into the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates are covered by LICENSE and NOTICE, shipped next to this file.
ignore-transitive-dependencies = false
private = { ignore = true }

# Crates whose declared license does not cover everything they compile into the binary
# (P6-E review M1, ADR-0002 rule 5). A clarification replaces what cargo-about would scan in
# the crate with exactly the files below; each text is taken from the crate's own sources in
# the cargo registry (offline) and pinned by SHA-256, so a new crate version whose texts differ
# makes the clarification fail. cargo-about only *warns* when a clarification fails and falls
# back to scanning, so packaging/deb/check-notices.sh fails the build when the FreeType or
# Lucide texts are missing from the generated file.

# freetype-sys compiles its bundled FreeType 2.13.2 (C) statically whenever the system's
# FreeType is older than its 24.3.18 floor, which is the case in the Ubuntu 22.04 builder
# (24.1.18). FreeType is dual-licensed FTL / GPLv2; NineSQL takes it under the FTL (I7), whose
# credit is also in NOTICE. The BDF and PCF drivers and fthash.c, compiled in too, carry their
# own MIT-style notices (freetype2/LICENSE.TXT). The crate's Rust bindings are MIT.
[freetype-sys]
accepted = ["FTL"]

[freetype-sys.clarify]
license = "MIT AND FTL"

[[freetype-sys.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "8911cb953a89daca54f0ab96616f5e447e2b1399fba7ec098872cfdacde5354b"

[[freetype-sys.clarify.files]]
path = "freetype2/docs/FTL.TXT"
license = "FTL"
checksum = "08c135755dd589039470f1fdbb400daaabaaa50d0b366d19cebff4d22986baa1"

[[freetype-sys.clarify.files]]
path = "freetype2/src/bdf/README"
