# cargo-about configuration of the third-party license file shipped in the .deb
# (/usr/share/doc/ninesql/THIRD-PARTY-LICENSES.txt, P6-A, ADR-0010 §1, ADR-0002 rule 5).
# Run by packaging/deb/build.sh with --frozen (no network): license texts come from the crates themselves,
# nothing is fetched (no ClearlyDefined, no git).

# The licenses deny.toml allows (ADR-0002, I7). A crate under any other license makes
# `cargo about generate --fail` fail, as `cargo deny check licenses` does.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
]
# The binary is built for this target only.
targets = ["x86_64-unknown-linux-gnu"]
# Only what is linked into the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates are covered by LICENSE and NOTICE, shipped next to this file.
ignore-transitive-dependencies = false
private = { ignore = true }
