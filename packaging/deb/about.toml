# gpui-kit-assets declares Apache-2.0 (its code) but embeds about 1,830 Lucide SVG icons under
# ISC, some of them derived from Feather under MIT (its LICENSE-LUCIDE). cargo-about would keep
# only the Apache-2.0 text (canonical: the crate ships no Apache file).
[gpui-kit-assets.clarify]
license = "Apache-2.0 AND ISC AND MIT"

[[gpui-kit-assets.clarify.files]]
path = "LICENSE-LUCIDE"
license = "ISC"
start = "ISC License"
end = "OR PERFORMANCE OF THIS SOFTWARE."
