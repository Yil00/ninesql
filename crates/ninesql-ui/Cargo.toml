[package]
name = "ninesql-ui"
description = "Native database client (NineSQL desktop application, GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The end-to-end scenario runner (ADR-0029 §2): `--e2e-run <file> --e2e-out <dir>`, a read-only
# state probe and the core's test-build guards. Test-only and Linux-only: never in `default`, no
# other crate enables it, and package builds refuse a binary built with it (`make
# e2e-feature-guard`, packaging/check-no-e2e-marker.sh).
e2e-scenarios = ["ninesql-core/e2e-scenarios", "dep:nix", "dep:serde_json"]

[dependencies]
ninesql-core.workspace = true
ninesql-grid.workspace = true
ninesql-editor.workspace = true
thiserror.workspace = true
# The session file model (`scripts::session`, F-WS-06); already in the graph through the core.
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
# The `ninesql` binary's subscriber (src/logging.rs, ADR-0029 §3); the library installs none.
tracing-subscriber.workspace = true
# `O_NOFOLLOW` for the file log (src/logging.rs); already in the graph through the storage crate.
libc.workspace = true
# Scenario runner only (feature `e2e-scenarios`): the account's home directory from the password
# database (`getpwuid_r`, ADR-0029 §2.4) and `results.json`. Both already in the graph.
nix = { version = "0.31", default-features = false, features = ["user"], optional = true }
serde_json = { workspace = true, optional = true }
# Fresh ids for saved secrets (`<connection>:<slot>:<uuid>`) and zeroized buffers for typed secrets.
uuid.workspace = true
zeroize.workspace = true
# GPUI and gpui-component through gpui-kit, a normal dependency since P1-A (ADR-0013: controls
# 1-5 and 7 in place, audit trail in docs/audits/gpui-snapshot.md). Never enable `hot-reload`,
# `tracy`, `inspector` or `gpui-fast`.
gpui-kit = { workspace = true, features = ["component", "assets", "tree-sitter-sql"] }
# Exact pins of the gpui-kit family (root Cargo.toml, ADR-0013): listed so `=0.9.1` constrains
# resolution; gpui-kit itself only asks for "0.9.1" (caret).
gpui-base.workspace = true
gpui-component.workspace = true
gpui-component-macros.workspace = true
gpui-kit-assets.workspace = true
# The drivers NineSQL ships (L5). Only the `ninesql` binary (src/main.rs) names them, to register
# them in the core's `DriverRegistry` at startup; the library talks to drivers through
# `ninesql-core` only (docs/02-architecture.md). Cargo has no binary-only dependencies, hence here.
ninesql-driver-pgwire = { path = "../drivers/ninesql-driver-pgwire" }
ninesql-driver-mysqlwire = { path = "../drivers/ninesql-driver-mysqlwire" }
ninesql-driver-sqlite = { path = "../drivers/ninesql-driver-sqlite" }

[[bin]]
name = "ninesql"
path = "src/main.rs"

# The .deb (P6-A, ADR-0010 §1), built by packaging/deb/build.sh with cargo-deb (`--no-build`:
# the binary comes from the Ubuntu 22.04 builder). cargo-deb reads this table from the manifest
# of the package that owns the binary, hence here; see packaging/README.md. Paths starting with
# `target/release/` are taken from the build's target directory (the binary, the man page and
# the third-party license file that build.sh generates there).
[package.metadata.deb]
name = "ninesql"
# Maintainer address of the package: to be replaced by a project address (P6-B).
maintainer = "NineSQL contributors <105881992+Yil00@users.noreply.github.com>"
copyright = "2026 MyDataVizion"
license-file = ["../../LICENSE", "0"]
section = "database"
priority = "optional"
extended-description = """\
NineSQL is a native database client for Debian and Ubuntu, written in Rust with a \
GPU-rendered interface. It connects to PostgreSQL, MySQL, MariaDB, SQLite and wire-compatible \
engines, and imports DBeaver workspaces without modifying them. It sends no telemetry and \
connects only to the databases you declare and their SSH hops."""
# Linked: libc6 (glibc 2.35 at most, checked by build.sh), libgcc-s1, libxcb1, libxkbcommon0,
# libxkbcommon-x11-0. Loaded at run time by GPUI: the Vulkan loader, Wayland and fontconfig.
# Listed by hand rather than with $auto (dpkg-shlibdeps), so the result does not depend on the
# host that runs cargo-deb and the names resolve on Debian 12 / 13 and Ubuntu 22.04 / 24.04
# (packaging/deb/install-test.sh).
depends = "libc6 (>= 2.35), libgcc-s1, libxcb1, libxkbcommon0, libxkbcommon-x11-0, libvulkan1, libwayland-client0, libfontconfig1"
recommends = "mesa-vulkan-drivers | vulkan-icd"
# No maintainer scripts at all (ADR-0010 §1): nothing runs at install or removal; dpkg
# triggers refresh the icon, desktop and man caches.
assets = [
    ["target/release/ninesql", "usr/bin/", "755"],
    ["target/release/ninesql.1.gz", "usr/share/man/man1/", "644"],
    ["target/release/THIRD-PARTY-LICENSES.txt", "usr/share/doc/ninesql/", "644"],
    ["../../NOTICE", "usr/share/doc/ninesql/", "644"],
    ["../../packaging/linux/io.github.yil00.NineSQL.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/io.github.yil00.NineSQL.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../docs/assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/io.github.yil00.NineSQL.svg", "644"],
    ["../../packaging/linux/icons/32.png", "usr/share/icons/hicolor/32x32/apps/io.github.yil00.NineSQL.png", "644"],
    ["../../packaging/linux/icons/48.png", "usr/share/icons/hicolor/48x48/apps/io.github.yil00.NineSQL.png", "644"],
    ["../../packaging/linux/icons/64.png", "usr/share/icons/hicolor/64x64/apps/io.github.yil00.NineSQL.png", "644"],
    ["../../packaging/linux/icons/128.png", "usr/share/icons/hicolor/128x128/apps/io.github.yil00.NineSQL.png", "644"],
    ["../../packaging/linux/icons/256.png", "usr/share/icons/hicolor/256x256/apps/io.github.yil00.NineSQL.png", "644"],
    ["../../packaging/linux/icons/512.png", "usr/share/icons/hicolor/512x512/apps/io.github.yil00.NineSQL.png", "644"],
]

[dev-dependencies]
# TestAppContext for view-model tests (AGENTS.md): GPUI's own `test-support`, see root Cargo.toml.
gpui-pre = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# The in-memory mock driver (feature `mock`) and the in-memory secret store for connection flow
# tests; never in release builds.
ninesql-core = { workspace = true, features = ["mock"] }
ninesql-secrets = { workspace = true, features = ["memory-store"] }
proptest.workspace = true
serde_json.workspace = true
# The engine tests (src/engine_tests, ADR-0029 step 1): a separate driver session on the driver's
# own runtime to set up scratch tables and read values back, and the SQLite "nine" seed. Both are
# already in the graph (the drivers), with the same features.
tokio = { workspace = true, features = ["rt", "net", "time"] }
rusqlite.workspace = true
# Regression test of the patched X11 IME decoder ([patch.crates-io] in the root Cargo.toml).
xim-ctext = { version = "=0.3.0", default-features = false }

# Anchors GPUI's XIM client to the patched release: GPUI asks for `^0.4.0-zed`, so without this exact
# requirement a newer 0.4.x from crates.io could replace the patched copy on `cargo update`.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
zed-xim = { version = "=0.4.0-zed", default-features = false }
