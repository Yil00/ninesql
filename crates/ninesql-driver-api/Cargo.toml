[package]
name = "ninesql-driver-api"
description = "Driver traits, capabilities, dialects and result types (ADR-0004)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# In-memory mock driver for UI and core tests. Never enabled in release builds.
mock = []

[dependencies]
arrow-array.workspace = true
arrow-data.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
futures-core.workspace = true
futures-util.workspace = true
thiserror.workspace = true
# `rt`: the result stream's timeout watchdog task (spawned on the current runtime).
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
# Enables the `mock` feature for this crate's own integration tests.
ninesql-driver-api = { path = ".", features = ["mock"] }
