[package]
name = "ninesql-dbeaver"
description = "DBeaver workspace import and export (ADR-0006)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Lower layers only: `ninesql-core` depends on this crate (docs/02-architecture.md), so the
# import model mirrors the core connection model instead of using it.
ninesql-driver-api.workspace = true
ninesql-secrets.workspace = true
ninesql-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
# credentials-config.json: AES-128-CBC with DBeaver Community's public fixed key.
aes = "0.8"
cbc = "0.1"

[dev-dependencies]
# `alloc` for the test-only encryption helper (`encrypt_padded_vec_mut`).
cbc = { version = "0.1", features = ["alloc"] }
# Drift test only (tests/driver_properties.rs): the property names the import produces must be
# on each driver's declared allowlist (`ConnectCapabilities::accepted_properties`). Never a
# normal dependency: `ninesql-core` owns the drivers (docs/02-architecture.md).
ninesql-driver-mysqlwire = { path = "../drivers/ninesql-driver-mysqlwire" }
ninesql-driver-pgwire = { path = "../drivers/ninesql-driver-pgwire" }
ninesql-driver-sqlite = { path = "../drivers/ninesql-driver-sqlite" }
proptest.workspace = true
tempfile.workspace = true
