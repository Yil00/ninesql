[package]
name = "ninesql-core"
description = "Application state, connection model and services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["desktop-lock"]
# Starts `DesktopLockWatcher` in `CoreServices`: the vault and the "ask every time" cache are
# locked on sleep and screen lock (logind, zbus 6 only). On by default.
desktop-lock = ["ninesql-secrets/desktop-lock"]
# Uses the Secret Service (keyring) as the first secret backend when one answers. Off by default
# until the desktop round trip and the stable secret-service 6.x (ADR-0012).
secret-service = ["ninesql-secrets/secret-service", "desktop-lock"]
# Registers nothing by itself: exposes `ninesql_driver_api::mock` (the in-memory mock driver) to
# UI and core tests. Never enabled in release builds.
mock = ["ninesql-driver-api/mock"]

[dependencies]
ninesql-driver-api.workspace = true
ninesql-storage.workspace = true
ninesql-secrets.workspace = true
ninesql-ssh.workspace = true
ninesql-transfer.workspace = true
ninesql-dbeaver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
secrecy.workspace = true
zeroize.workspace = true
# Driver runtime (ADR-0004): one multi-thread runtime owned by the core, channels to the UI.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
ninesql-driver-api = { workspace = true, features = ["mock"] }
# Core + pgwire integration test (tests/pgwire_tunnel.rs): a real driver behind the connect flow.
ninesql-driver-pgwire = { path = "../drivers/ninesql-driver-pgwire" }
async-trait.workspace = true
ninesql-secrets = { workspace = true, features = ["memory-store"] }
proptest.workspace = true
tempfile.workspace = true
