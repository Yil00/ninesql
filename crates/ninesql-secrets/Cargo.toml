[package]
name = "ninesql-secrets"
description = "Secret Service and encrypted vault storage for credentials (ADR-0005)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
secrecy.workspace = true
zeroize.workspace = true
secret-service = { workspace = true, optional = true }
ninesql-storage.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
# CLOCK_BOOTTIME for idle / expiry deadlines that keep running during suspend.
rustix = { workspace = true, features = ["time"] }
# Only to enable `aes/zeroize` (feature unification) for the AES-128 key schedule that
# secret-service keeps in its cbc Encryptor / Decryptor.
aes = { workspace = true, optional = true }
# Session-bus connection with a method timeout for secret-service (same zbus 6).
zbus = { workspace = true, optional = true }

[features]
default = []
# In-memory store and fast (insecure) vault KDF parameters for tests of dependent crates
# (ADR-0005). Never enabled in release builds.
memory-store = []
# Freedesktop Secret Service backend (pure-Rust zbus 6 client, Rust crypto). Needs Rust >= 1.89.
# Off by default until the review of secret-service 6.0.0-rc.1 (ROADMAP, P0-D review L5) and the
# desktop round trip (ADR-0012) are closed.
secret-service = ["dep:secret-service", "dep:aes", "dep:zbus"]

[dev-dependencies]
serde_json.workspace = true
proptest.workspace = true
tempfile.workspace = true
