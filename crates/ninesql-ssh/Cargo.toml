[package]
name = "ninesql-ssh"
description = "SSH tunnels with russh, jump hosts and known_hosts checks (ADR-0011)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ninesql-driver-api.workspace = true
ninesql-storage.workspace = true
# Pure-Rust SSH (ADR-0011 §5). `ring` is the crypto provider (no OpenSSL, no aws-lc C build);
# `flate2` (compression) is off: no decompression of untrusted data is needed for a tunnel.
russh = { workspace = true }
data-encoding = { workspace = true }
libc.workspace = true
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
secrecy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
rand.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "time", "io-util", "macros", "process"] }
