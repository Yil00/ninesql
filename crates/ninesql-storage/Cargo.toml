[package]
name = "ninesql-storage"
description = "Workspace and settings storage under XDG directories (ADR-0008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc.workspace = true
# `fs`: `renameat2(RENAME_NOREPLACE)` for `fs::write_new_atomic`.
rustix = { workspace = true, features = ["fs"] }
zeroize.workspace = true
# history.sqlite (ADR-0008 §1, P3-C): the bundled SQLite the sqlite driver already uses.
rusqlite.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
