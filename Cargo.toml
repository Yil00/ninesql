[workspace]
resolver = "3"
members = ["crates/*"]
# Patched copies of third-party crates (ADR-0013 rules, docs/audits/gpui-snapshot.md): reached
# only through [patch.crates-io] below, never workspace members.
exclude = ["crates/patches"]
# Driver crates are added under crates/drivers/ from P1-B (ADR-0003) and listed here.

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"  # floor set by zbus 6 (ADR-0012); toolchain itself is stable
license = "Apache-2.0"
repository = "https://github.com/Yil00/ninesql"
authors = ["NineSQL contributors"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# Internal crates
ninesql-core = { path = "crates/ninesql-core" }
ninesql-driver-api = { path = "crates/ninesql-driver-api" }
ninesql-storage = { path = "crates/ninesql-storage" }
ninesql-secrets = { path = "crates/ninesql-secrets" }
ninesql-ssh = { path = "crates/ninesql-ssh" }
ninesql-transfer = { path = "crates/ninesql-transfer" }
ninesql-dbeaver = { path = "crates/ninesql-dbeaver" }
ninesql-grid = { path = "crates/ninesql-grid" }
ninesql-editor = { path = "crates/ninesql-editor" }

# Shared by several crates
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["std"] }
proptest = "1"

# Storage, connection model and secrets (P0-D)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Comment-preserving edits of settings.toml (P1-A); the version toml 0.8 already uses.
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
uuid = { version = "1", features = ["v4", "serde"] }
secrecy = "0.10"
secret-service = { version = "=6.0.0-rc.1", default-features = false, features = ["rt-default", "crypto-rust"] }
# Same zbus 6 as secret-service pulls in: only to build its session connection with a method
# timeout (zbus 6 has none by default).
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }
# Encrypted vault (P1-D, ADR-0005 §2): RustCrypto crates only, versions aligned with the ones
# russh already pulls in (argon2 0.6, chacha20 0.10, aead 0.6, getrandom 0.4).
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4", default-features = false }
# Not used directly: enables `zeroize` on the aes 0.9 that secret-service already pulls in.
aes = { version = "0.9", default-features = false, features = ["zeroize"] }
tempfile = "3"
libc = "0.2"
# Safe `geteuid` for the workspace ownership check (already in the graph through tempfile).
rustix = { version = "1", default-features = false, features = ["std", "process"] }

# SSH tunnels (P1-D, ADR-0011 §5). russh with the `ring` provider only: no OpenSSL, no aws-lc,
# no compression. The `rsa` feature is off: it pins rsa =0.10.0-rc.18, flagged by RUSTSEC-2023-0071
# (no new advisory ignore allowed), so RSA host / client keys are unsupported until russh moves to
# rsa >= 0.10.0. RustCrypto versions match the ones russh already pulls in.
russh = { version = "0.65.1", default-features = false, features = ["ring"] }
data-encoding = "2.3"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
# Tests only (key generation); same major as russh / ssh-key.
rand = { version = "0.10", default-features = false, features = ["std", "thread_rng"] }

# Driver API (ADR-0004): Arrow sub-crates only, async contract.
arrow-array = { version = "60.1", default-features = false }
arrow-schema = { version = "60.1", default-features = false }
# Copy-on-slice of truncated batches (MutableArrayData); already a dependency of arrow-array.
arrow-data = { version = "60.1", default-features = false }
async-trait = "0.1"
futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }

# GPUI and gpui-component, pinned as one set from crates.io (ADR-0013, P0-A, docs/spikes/p0-a-gpui.md).
# gpui-kit 0.9.1 = longbridge/gpui-component tag v0.9.1 (39ab849a93b5f15507b969164d49891db8d5b470);
# it pins GPUI exactly to gpui-pre =0.3.12, a snapshot of zed-industries/zed@d2a4fb6.
# The gpui-kit family requires its siblings with caret ranges ("0.9.1"), so each one is
# exact-pinned here and used as a direct dependency of ninesql-ui: that is what holds
# resolution on 0.9.1. Bump the set only in a dedicated `chore(ui): bump gpui` PR that runs
# scripts/verify-gpui-snapshot.sh and re-runs the spike.
gpui-kit = { version = "=0.9.1", default-features = false }
gpui-base = { version = "=0.9.1", default-features = false }
gpui-component = { version = "=0.9.1", default-features = false }
gpui-component-macros = { version = "=0.9.1", default-features = false }
gpui-kit-assets = { version = "=0.9.1", default-features = false }
# GPUI itself, already exact-pinned by gpui-kit; listed only so ninesql-ui tests can enable its
# `test-support` feature (TestAppContext) without gpui-kit's `test-support`, which would drag the
# optional `gpui-fast` family into Cargo.lock through weak features.
gpui-pre = { version = "=0.3.12", default-features = false }

# Argon2 is very slow unoptimized; the vault derives its key with the real parameters (64 MiB)
# in debug builds and tests too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# X11 IME crash fix (P1-A follow-up, docs/spikes/p0-a-gpui.md): exact copies of the crates.io
# releases locked in Cargo.lock, changed only where a file says "Modified for NineSQL". Each patch
# keeps the upstream version number, so `cargo update` cannot move it; drop it once upstream
# ships the fix. The diff summary is in docs/audits/gpui-snapshot.md.
[patch.crates-io]
xim-ctext = { path = "crates/patches/xim-ctext" }
zed-xim = { path = "crates/patches/zed-xim" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
