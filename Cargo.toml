[workspace]
resolver = "3"
members = ["crates/*"]
# Driver crates are added under crates/drivers/ from P1-B (ADR-0003) and listed here.

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Yil00/ninesql"
authors = ["NineSQL contributors"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# Internal crates
ninesql-core = { path = "crates/ninesql-core" }
ninesql-driver-api = { path = "crates/ninesql-driver-api" }
ninesql-storage = { path = "crates/ninesql-storage" }
ninesql-secrets = { path = "crates/ninesql-secrets" }
ninesql-ssh = { path = "crates/ninesql-ssh" }
ninesql-transfer = { path = "crates/ninesql-transfer" }
ninesql-dbeaver = { path = "crates/ninesql-dbeaver" }
ninesql-grid = { path = "crates/ninesql-grid" }
ninesql-editor = { path = "crates/ninesql-editor" }

# GPUI and gpui-component, pinned as one pair (ADR-0001 §3, P0-A, docs/spikes/p0-a-gpui.md).
# gpui-kit 0.9.1 = longbridge/gpui-component tag v0.9.1 (39ab849a93b5f15507b969164d49891db8d5b470);
# it pins GPUI exactly to gpui-pre =0.3.12, a crates.io snapshot of zed-industries/zed@d2a4fb6.
# Bump the pair only in a dedicated `chore(ui): bump gpui` PR that re-runs the spike.
gpui-kit = { version = "=0.9.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
